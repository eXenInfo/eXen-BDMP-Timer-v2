eholstert.","Der Stand wird erst freigegeben, wenn alle Schützen entladen und geholstert haben.","Es gibt keine anerkannten Waffen- und Munitionsfehler; Versager und Fehlfunktionen gehen zu Lasten des Schützen (C.6.8)."]},ppc1500:{id:"ppc1500",ruleRef:"C.8.5",label:"BDMP 1500 (PPC) und BDMP 1020",vorher:[{de:"Laden und holstern!",en:"Load and holster!",hinweis:"Die Waffe wird aus dem Holster genommen, geladen und wieder geholstert. Halbautomatische Pistolen werden grundsätzlich unterladen geholstert und erst zu Beginn der Serie fertiggeladen."},{de:"Sind die Schützen fertig?",en:"Is the line ready?",hinweis:"Wer nicht fertig ist, zeigt das klar und deutlich an. Dann lautet das Kommando „Nicht fertig!“ („The line is not ready“)."}],start:[{de:"Achtung!",en:"Stand by!",hinweis:"Kann durch ein anderes Signal ersetzt werden, etwa das Wegdrehen der Scheiben. Die Serie beginnt mit dem Herdrehen oder einem anderen Startsignal."}],abbruch:[{de:"Schießen einstellen!",en:"Cease firing!",hinweis:"Auch ein langanhaltender Pfiff. Das Schießen wird augenblicklich eingestellt."}],nachher:[{de:"Schießen einstellen – Waffe entladen und vorzeigen!",en:"Cease firing – unload and show clear!"},{de:"Sicherheit",en:"The line is clear."}],hinweise:["Die Mündung zeigt beim Vorzeigen immer in Richtung Geschossfang.","Revolver mit ausgeklappter Trommel und den zuletzt enthaltenen Hülsen vorzeigen.","Halbautomatische Pistolen mit offenem Verschluss und dem zuletzt benutzten Magazin vorzeigen.","Der Stand wird erst freigegeben, wenn alle Schützen entladen und geholstert haben.","Ein Verstoß gegen grundlegende Sicherheitsbestimmungen führt zur sofortigen Disqualifikation."]}},ov={stehendFrei:{name:"Stehend frei",ruleRef:"C.8.4",text:"Die Waffe wird mit einer oder beiden Händen gehalten. Unterstützende Hilfsmittel sind untersagt."},stehendPfosten:{name:"Stehend am Pfosten",ruleRef:"C.8.4",text:"Der Pfosten ist als Unterstützung zu benutzen, die Waffe selbst darf ihn nicht berühren. Der Schütze steht rechts hinter dem Pfosten, wenn er links schießt, und umgekehrt. Die gedachte oder markierte Linie an der Schussseite des Balkens darf nicht übertreten werden. Das Schießen am Pfosten beginnt mit der linken Hand; abgezogen wird mit einem Finger derselben Hand. Nur der Abzugsfinger befindet sich im Abzugsbügel, die schießende Hand darf durch die andere unterstützt werden."},kniendFrei:{name:"Kniend frei",ruleRef:"C.8.4",text:"Kniend auf einem Knie, das andere der Scheibe zugewandt. Die Gesäßbacken können auf den Absätzen oder seitlich auf dem Fuß aufliegen, dürfen den Boden aber nicht berühren. Der Arm darf durch das zur Scheibe zeigende Knie stabilisiert werden, die Waffe selbst nicht. Alternativ kniend auf beiden Knien, dann deutlich vom Boden entfernt und ohne weitere Unterstützung."},kniendPfosten:{name:"Kniend mit Pfosten",ruleRef:"C.8.4",text:"Nur für die 40- und 48-Schuss-Matches. Der Pfosten ist zu benutzen, die Waffe darf ihn nicht berühren. Der Schütze kniet links hinter dem Pfosten, wenn er rechts schießt, und umgekehrt."},sitzend:{name:"Sitzend",ruleRef:"C.8.4",text:"Beide Gesäßbacken auf dem Boden, der Körper den Scheiben zugewandt. Eine Hand kann stützen, der Ellenbogen darf den Boden nicht berühren, der Rücken ebenfalls nicht. Ein oder beide Knie dürfen angewinkelt sein. Die Waffe darf nicht durch einen Fuß unterstützt werden. Der Pfosten darf nicht benutzt werden."},liegend:{name:"Liegend",ruleRef:"C.8.4",text:"Der Körper liegt ausgestreckt in Sichtlinie, den Kopf zum Ziel; schräges Liegen ist zulässig, solange die Linie gewahrt bleibt und niemand gestört wird. Die Waffe darf durch eine oder beide am Boden aufliegende Hände unterstützt werden, darf aber selbst keinen Bodenkontakt haben. Der Pfosten darf nicht benutzt werden."}},uv=["Beim Einnehmen aller Stellungen zeigt die Mündung immer in Richtung Geschossfang.","Beim Wechsel von kniend in stehend, sitzend in liegend und liegend in stehend muss die halbautomatische Pistole mit zurückgezogenem Schlitten und entferntem Magazin geführt werden, der Revolver mit geöffneter Trommel und entfernten Hülsen.","Der Abzugsfinger befindet sich dabei deutlich erkennbar außerhalb des Abzugsbügels.","Nachgeladen wird erst nach dem Wechsel der Schießstellung.","Beim Wechsel von sitzend in liegend muss die Waffe nach vorn in Richtung Geschossfang zeigen."],cv={abgesenkt45:{ruleRef:"C.6A.6",text:"Die Waffe wird mit ausgestreckten Armen auf 45 Grad abgesenkt, die Mündung zielt auf den Boden."},npaWaagerecht:{ruleRef:"C.7.6",text:"Die Waffe wird waagerecht zum Boden gehalten. Die Ellenbogen liegen am Körper an, Ober- und Unterarm bilden einen Winkel von 90 Grad. Die Mündung zielt auf die Scheibe."},ppZweiGemischt:{ruleRef:"C.6B",text:"Station A: Die Waffe wird mit ausgestreckten Armen auf 45 Grad abgesenkt, die Mündung zielt auf den Boden. Stationen B und C: Die Waffe ist geholstert, halbautomatische Pistolen unterladen."},geholstert:{ruleRef:"C.8.7",text:"Der Schütze steht aufrecht, die geladene Waffe im Holster; halbautomatische Pistolen unterladen. Arme und Hände hängen zwanglos herab und berühren weder Waffe noch Holster, bis sich die Scheiben herdrehen oder ein anderes Startsignal gegeben wird. Eine abweichende Handposition zum Starten eines Timers am Arm oder Pfosten ist zulässig."}},dv=[{match:/^Police Pistol 1 \(SM\)|^Super Magnum|^SM\b/i,ruleRef:"C.6C",commandSet:"policePistol",readiness:"abgesenkt45",varianten:[{klasse:"kurzwaffe",ruleRef:"C.6C",label:"Super Magnum"}],ammo:"30 Patronen, mindestens 1200 Joule",target:"PP-1-Scheibe",ablauf:["25 m: 2 × 5 Schüsse in 2 Minuten einschließlich eines eventuellen Nachladens.","15 m: 2 × 5 Schüsse in Intervallen. Die Scheibe zeigt sich fünfmal für je 3 Sekunden, dabei jeweils 1 Schuss.","10 m: 2 × 5 Schüsse in Intervallen. Die Scheibe zeigt sich fünfmal für je 2 Sekunden, dabei jeweils 1 Schuss."],hinweise:["Die Geschossenergie muss bei einer E2-Messung mindestens 1200 Joule erreichen.","Die Sammlung führt die Disziplin als „ 5 m: 6 rounds in 15 seconds.","25 Meter/Yards - 12 Sekunden - nur double action":"25 metres/yards - 12 seconds - double action only","25 Meter/Yards - 90 Sekunden - nur double action":"25 metres/yards - 90 seconds - double action only","2x (5x 1 Schuss in 2s)":"2× (5× 1 round in 2s)","2x (5x 1 Schuss in 3s)":"2× (5× 1 round in 3s)","2x (max. 2-2-1 Schuss in 3x 2s)":"2× (max. 2-2-1 rounds in 3× 2s)","2x 5 Schuss in 100 Sekunden":"2× 5 rounds in 100 seconds","2x 5 Schuss in 120 Sekunden":"2× 5 rounds in 120 seconds","2x 6 Schuss in 5 Sekunden":"2× 6 rounds in 5 seconds","3 x 6 Schuss in 90 Sek. inkl. Nachladen":"3 × 6 rounds in 90 sec. including the reload","30 Patronen":"30 cartridges","30 Patronen, keine Wadcutter":"30 cartridges, no wadcutters","30 Patronen, mindestens 1200 Joule":"30 cartridges, at least 1200 joules","3x 2 Schuss in 2 Sekunden.":"3× 2 rounds in 2 seconds.","3x 2 Schuss in 3 Sekunden":"3× 2 rounds in 3 seconds","4 x 6 Schuss in 165 Sek. inkl. Nachladen":"4 × 6 rounds in 165 sec. including the reload","5 einhändig rechte Scheibe, 5 beidhändig linke Scheibe":"5 one-handed on the right-hand target, 5 two-handed on the left-hand target","5 rechts, 5 links am Pfosten vorbei":"5 to the right, 5 to the left past the barricade","50 Meter/Yards - 165 Sekunden - auch single action erlaubt":"50 metres/yards - 165 seconds - single action also permitted","6 Schuss in 10 Sekunden":"6 rounds in 10 seconds","6 Schuss in 10 Sekunden davon 3 auf jede Scheibe.":"6 rounds in 10 seconds, 3 of them on each target.","6 Schuss in 15 Sekunden":"6 rounds in 15 seconds","6 Schuss in 15 Sekunden auf die linke Scheibe.":"6 rounds in 15 seconds on the left-hand target.","6 Schuss in 6 Sekunden":"6 rounds in 6 seconds","6 Schuss in 6 Sekunden davon 3 auf jede Scheibe.":"6 rounds in 6 seconds, 3 of them on each target.","6 Schuss in 8 Sekunden":"6 rounds in 8 seconds","6 Schuss kniend":"6 rounds kneeling","6 Schuss liegend":"6 rounds prone","6 Schuss stehend frei":"6 rounds standing unsupported","6 Schuss stehend freihändig.":"6 rounds standing unsupported.","6 Schuss stehend, linke Hand, Pfosten links":"6 rounds standing, left hand, left barricade","6 Schuss stehend, rechte Hand, Pfosten rechts":"6 rounds standing, right hand, right barricade","6 Schüsse kniend frei":"6 rounds kneeling unsupported","6 Schüsse liegend":"6 rounds prone","6 Schüsse sitzend":"6 rounds seated","6 Schüsse stehend frei":"6 rounds standing unsupported","6 Schüsse stehend frei, nur double action.":"6 rounds standing unsupported, double action only.","6 Schüsse stehend, linke Hand, Pfosten links":"6 rounds standing, left hand, left barricade","6 Schüsse stehend, rechte Hand, Pfosten rechts":"6 rounds standing, right hand, right barricade","60 Patronen, dazu 6 Probeschüsse":"60 cartridges, plus 6 sighting shots","6x 1 Schuss in 2 Sekunden":"6× 1 round in 2 seconds","6x 1 Schuss in 2 Sekunden.":"6× 1 round in 2 seconds.","6x 1 Schuss in 3 Sekunden":"6× 1 round in 3 seconds","7 m: 2 × 5 Schüsse in Intervallen. Die Scheibe zeigt sich dreimal für je 2 Sekunden, dabei höchstens 2 Schüsse je Intervall (2-2-1, 2-1-2 oder 1-2-2).":"7 m: 2 × 5 rounds in intervals. The target faces three times for 2 seconds each, with at most 2 rounds per interval (2-2-1, 2-1-2 or 1-2-2).","7 Meter/Yards - 20 Sekunden - nur double action":"7 metres/yards - 20 seconds - double action only","90 Sekunden":"90 seconds","Ab dieser Station darf nur noch ein Magazin benutzt werden, das wieder gefüllt werden muss; für den Revolver kein Schnelllader mehr (C.17.9).":"From this station on, only one magazine may be used and it has to be refilled; no speedloader for the revolver any more (C.17.9).","Auch ein langanhaltender Pfiff. Das Schießen wird augenblicklich eingestellt.":"A long sustained whistle counts as well. Firing stops immediately.","Auch single action erlaubt.":"Single action also permitted.","Auf das Startsignal ziehen und stehend mit der rechten Hand rechts am Pfosten vorbei schießen.":"On the start signal, draw and fire standing with the right hand past the right-hand side of the barricade.","Auf das Startsignal ziehen und stehend schießen, ohne zu spannen bzw. nach dem Durchladen.":"On the start signal, draw and fire standing, without cocking or after chambering.","Auf das Startsignal ziehen, Anschlag kniend einnehmen und schießen.":"On the start signal, draw, take up the kneeling position and fire.","Auf das Startsignal ziehen, Anschlag liegend einnehmen, erster Schuss ohne zu spannen bzw. nach dem Durchladen.":"On the start signal, draw, take up the prone position, first round without cocking or after chambering.","Auf das Startsignal ziehen, Anschlag stehend einnehmen und alle fünf Schüsse in zehn Sekunden abgeben.":"On the start signal, draw, take up the standing position and fire all five rounds within ten seconds.","Auf das Startsignal ziehen, auf den Boden setzen und schießen, ohne zu spannen bzw. nach dem Durchladen.":"On the start signal, draw, sit down on the ground and fire, without cocking or after chambering.","Auf das Startsignal ziehen, das Schlagstück von Hand spannen und stehend einhändig auf die obere rechte Ringscheibe schießen.":"On the start signal, draw, cock the hammer by hand and fire standing one-handed at the upper right scoring target.","Auf den Stationen B und C ist die gesamte Munition am Schützen mitzuführen. Geladen werden darf nur ein Reservemagazin bzw. ein Speedloader mit je 6 Patronen, die restlichen 12 Patronen lose in Tasche, Patronenhalter oder am Gürtel.":"On stations B and C the shooter carries all the ammunition. Only one spare magazine or speedloader may be loaded, with 6 cartridges each; the remaining 12 cartridges go loose in a pocket, a cartridge holder or on the belt.","Auf Kommando auf die 1-m-Linie vorgehen.":"On command, move forward to the 1 m line.","Ausnahme zu C.17.12: Hier darf die Waffe vor dem Startsignal am Griffstück erfasst werden.":"Exception to C.17.12: here the weapon may be gripped before the start signal.","BDMP 1020":"BDMP 1020","BDMP 1500 (PPC)":"BDMP 1500 (PPC)","BDMP 1500 (PPC) und BDMP 1020":"BDMP 1500 (PPC) and BDMP 1020","BDMP 1500 / 1020 (C.8.5)":"BDMP 1500 / 1020 (C.8.5)","BDMP 1500 Carbine":"BDMP 1500 Carbine","BDMP 1500 Matches 1-5 C.8.2":"BDMP 1500 Matches 1-5 C.8.2","BDMP-1500-Scheibe je Schütze und Match":"one BDMP 1500 target per shooter and match","Bei zwei Scheiben: Station 1 und 3 auf die linke, Station 2 und 4 auf die rechte Scheibe.":"With two targets: stations 1 and 3 on the left-hand target, stations 2 and 4 on the right-hand one.","Beide Gesäßbacken auf dem Boden, der Körper den Scheiben zugewandt. Eine Hand kann stützen, der Ellenbogen darf den Boden nicht berühren, der Rücken ebenfalls nicht. Ein oder beide Knie dürfen angewinkelt sein. Die Waffe darf nicht durch einen Fuß unterstützt werden. Der Pfosten darf nicht benutzt werden.":"Both buttocks on the ground, the body facing the targets. One hand may support, but the elbow must not touch the ground, nor may the back. One or both knees may be bent. The weapon must not be supported by a foot. The barricade must not be used.","Beim Einnehmen aller Stellungen zeigt die Mündung immer in Richtung Geschossfang.":"While taking up any position the muzzle always points towards the backstop.","Beim Nachladen muss die Pistole geholstert sein — Verschluss hinten oder geschlossen und abgeschlagen. Der Revolver wird direkt in die Trommel nachgeladen.":"For the reload the pistol has to be holstered — slide locked back, or closed with the hammer down. The revolver is reloaded directly into the cylinder.","Beim Wechsel von kniend in stehend, sitzend in liegend und liegend in stehend muss die halbautomatische Pistole mit zurückgezogenem Schlitten und entferntem Magazin geführt werden, der Revolver mit geöffneter Trommel und entfernten Hülsen.":"When changing from kneeling to standing, from seated to prone and from prone to standing, the semi-automatic pistol is carried with the slide locked back and the magazine removed, the revolver with the cylinder open and the cases removed.","Beim Wechsel von sitzend in liegend muss die Waffe nach vorn in Richtung Geschossfang zeigen.":"When changing from seated to prone the weapon must point forward towards the backstop.","Dazu die Waffen laden und Holstern.":"Load and holster your weapons for this.","Der Abzugsfinger befindet sich dabei deutlich erkennbar außerhalb des Abzugsbügels.":"The trigger finger stays visibly outside the trigger guard while doing so.","Der Fuß muss Kontakt zur Verlängerung der seitlichen Begrenzung haben.":"The foot has to stay in contact with the extension of the lateral boundary.","Der Körper liegt ausgestreckt in Sichtlinie, den Kopf zum Ziel; schräges Liegen ist zulässig, solange die Linie gewahrt bleibt und niemand gestört wird. Die Waffe darf durch eine oder beide am Boden aufliegende Hände unterstützt werden, darf aber selbst keinen Bodenkontakt haben. Der Pfosten darf nicht benutzt werden.":"The body lies stretched out along the line of sight, head towards the target; lying at an angle is permitted as long as the line is kept and nobody is disturbed. The weapon may be supported by one or both hands resting on the ground, but must not touch the ground itself. The barricade must not be used.","Der Pfosten darf als Unterstützung dienen, die Waffe darf ihn jedoch nicht berühren.":"The barricade may be used as support, but the weapon must not touch it.","Der Pfosten ist als Unterstützung zu benutzen, die Waffe selbst darf ihn nicht berühren. Der Schütze steht rechts hinter dem Pfosten, wenn er links schießt, und umgekehrt. Die gedachte oder markierte Linie an der Schussseite des Balkens darf nicht übertreten werden. Das Schießen am Pfosten beginnt mit der linken Hand; abgezogen wird mit einem Finger derselben Hand. Nur der Abzugsfinger befindet sich im Abzugsbügel, die schießende Hand darf durch die andere unterstützt werden.":"The barricade has to be used as support, but the weapon must not touch it. The shooter stands to the right behind the barricade when shooting on the left, and the other way round. The imaginary or marked line on the firing side of the post must not be crossed. Barricade shooting starts with the left hand; the trigger is pulled with a finger of that same hand. Only the trigger finger is inside the trigger guard, and the shooting hand may be supported by the other one.","Der Schütze steht aufrecht, die geladene Waffe im Holster; halbautomatische Pistolen unterladen. Arme und Hände hängen zwanglos herab und berühren weder Waffe noch Holster, bis sich die Scheiben herdrehen oder ein anderes Startsignal gegeben wird. Eine abweichende Handposition zum Starten eines Timers am Arm oder Pfosten ist zulässig.":"The shooter stands upright with the loaded weapon in the holster; semi-automatic pistols holstered with an empty chamber. Arms and hands hang down loosely and touch neither weapon nor holster until the targets turn or another start signal is given. A different hand position for starting a timer on the arm or the barricade is permitted.","Der Stand wird erst freigegeben, wenn alle Schützen entladen und geholstert haben.":"The range is only cleared once every shooter has unloaded and holstered.","Der Stellungswechsel darf ausschließlich mit leerer Waffe erfolgen: Magazin entfernt und Verschluss offen, beziehungsweise Trommel leer und ausgeschwenkt.":"The change of position may only be made with an empty weapon: magazine removed and action open, or cylinder empty and swung out.","Der Veranstalter kann ein Warm-Up von 2:45 Minuten auf 50 m und 1:30 Minuten auf 25 m anbieten; auf Landes- und Deutschen Meisterschaften ist es verpflichtend.":"The organiser may offer a warm-up of 2:45 minutes at 50 m and 1:30 minutes at 25 m; at state and national championships it is mandatory.","Die Begrenzungslinien rechts und links sind zu beachten.":"The boundary lines to the right and left have to be observed.","Die Beobachtung der Wertungsschüsse durch den Schützen ist nicht erlaubt; Fremdbeobachtung und Coaching sind unzulässig.":"The shooter may not spot their own scoring shots; spotting by others and coaching are not allowed.","Die Entfernungen können wahlweise in Metern oder Yards geschossen werden; das ist in der Ausschreibung bekanntzugeben.":"The distances may be shot either in metres or in yards; this has to be stated in the match programme.","Die Geschossenergie muss bei einer E2-Messung mindestens 1200 Joule erreichen.":"The projectile energy has to reach at least 1200 joules in an E2 measurement.","Die Kleinkaliber-Variante DKS 1 – 1020 (C.15A) hat denselben Ablauf; dort wird Match 1 auf 10 m geschossen, die Scheibenentfernungen sind wahlweise 10 m, 15 m oder 25 m. Die Kommandos laufen ebenfalls nach C.8.5.":"The rimfire version DKS 1 – 1020 (C.15A) follows the same course of fire; there match 1 is shot at 10 m and the target distances are 10 m, 15 m or 25 m as chosen. Its commands also follow C.8.5.","Die Mündung zeigt beim Vorzeigen immer in Richtung Geschossfang.":"While showing clear the muzzle always points towards the backstop.","Die Reihenfolge der Matches und Stationen ist einzuhalten.":"The order of the matches and stations has to be kept.","Die Restzeit auf der Auswertekarte des Schützen vermerken.":"Note the remaining time on the shooter's score card.","Die Sammlung führt die Disziplin als „Police Pistol 1 (SM)“; der Ablauf ist der der Super Magnum nach C.6C, nicht der der Police Pistol 1.":"The collection lists this discipline as “Police Pistol 1 (SM)”; its course of fire is the Super Magnum one under C.6C, not that of the Police Pistol 1.","Die Schießhand darf mit der freien Hand unterstützt werden.":"The shooting hand may be supported by the free hand.","Die verbleibende Restzeit wird dem Schützen vor dem Startsignal mitgeteilt (C.17.8).":"The shooter is told the remaining time before the start signal (C.17.8).","Die Waffe wird aus dem Holster genommen, geladen und wieder geholstert. Halbautomatische Pistolen werden grundsätzlich unterladen geholstert und erst zu Beginn der Serie fertiggeladen.":"The weapon is taken from the holster, loaded and holstered again. Semi-automatic pistols are always holstered with an empty chamber and only fully loaded at the start of the string.","Die Waffe wird mit ausgestreckten Armen auf 45 Grad abgesenkt, die Mündung zielt auf den Boden.":"The weapon is lowered to 45 degrees with the arms extended, the muzzle pointing at the ground.","Die Waffe wird mit einer oder beiden Händen gehalten. Unterstützende Hilfsmittel sind untersagt.":"The weapon is held with one or both hands. Supporting aids are not allowed.","Die Waffe wird waagerecht zum Boden gehalten. Die Ellenbogen liegen am Körper an, Ober- und Unterarm bilden einen Winkel von 90 Grad. Die Mündung zielt auf die Scheibe.":"The weapon is held horizontally to the ground. The elbows rest against the body, upper and lower arm forming an angle of 90 degrees. The muzzle points at the target.","Die Zeit stoppt nach dem Holstern der geladenen Waffe.":"Timing stops once the loaded weapon is holstered.","DKS 1 – 1020":"DKS 1 – 1020","DKS 1 – 1020 (Kleinkaliber)":"DKS 1 – 1020 (rimfire)","DKS 2 – 1020":"DKS 2 – 1020","Double Action gilt nicht beim Gebrauch von Selbstladepistolen.":"Double action does not apply when self-loading pistols are used.","Double-Action-Pistole: mit 5 Patronen laden, entspannen, holstern.":"Double-action pistol: load with 5 cartridges, decock, holster.","Ein Verstoß gegen grundlegende Sicherheitsbestimmungen führt zur sofortigen Disqualifikation.":"A breach of the basic safety rules leads to immediate disqualification.","eine oder zwei NPA-Service-Pistol-Scheiben":"one or two NPA Service Pistol targets","Einzige Station, an der der erste Schuss nicht im Double-Action-Modus abgegeben wird (C.17.14).":"The only station where the first round is not fired in double action (C.17.14).","Ersatzweise ein Signal, oder die Scheiben werden weggedreht und nach etwa 5 Sekunden zum Start der Serie wieder hergedreht.":"Alternatively a signal, or the targets are turned away and turned back after about 5 seconds to start the string.","Erst nach Bestätigung durch die Aufsicht wird geholstert.":"Holster only after the range officer has confirmed.","Es dürfen nur sechs Patronen ins Magazin geladen werden.":"Only six cartridges may be loaded into the magazine.","Es gibt keine anerkannten Waffen- oder Munitionsfehler.":"There are no recognised weapon or ammunition malfunctions.","Es gibt keine anerkannten Waffen- und Munitionsfehler; Versager und Fehlfunktionen gehen zu Lasten des Schützen (C.6.8).":"There are no recognised weapon or ammunition malfunctions; misfires and stoppages are at the shooter's expense (C.6.8).","Europäischer Präzisions Parcours (EPP)":"European Precision Course (EPP)","Fertigstellung Station A: Waffe mit ausgestreckten Armen auf 45 Grad abgesenkt. Stationen B und C: Waffe geholstert.":"Ready position on station A: weapon lowered to 45 degrees with the arms extended. Stations B and C: weapon holstered.","Gleiche Distanzen und gleiche Zeiten wie die Kurzwaffenfassung.":"Same distances and same times as the handgun version.","Gleicher Ablauf und gleiche Zeiten wie die Kurzwaffenfassung.":"Same course of fire and same times as the handgun version.","Halbautomatische Pistolen mit offenem Verschluss und dem zuletzt benutzten Magazin vorzeigen.":"Show semi-automatic pistols with the action open and the magazine last used.","Halbautomatische Pistolen werden mit offenem Verschluss vorgezeigt, dazu das zuletzt benutzte Magazin.":"Semi-automatic pistols are shown with the action open, together with the magazine last used.","Hilfsmittel zum Training, keine Wettkampfdisziplin: eine reine Uhr über 90 und 165 Sekunden. Deshalb ohne Kommandofolge und ohne Ansage.":"A training aid, not a competition discipline: a plain clock over 90 and 165 seconds. That is why it carries no command sequence and no announcement.","höchstens sechs Patronen in Waffe, Speedloader oder Magazin":"at most six cartridges in weapon, speedloader or magazine","Ist ein Stand für 7 m nicht zugelassen, darf stattdessen auf 10 m geschossen werden.":"If a range is not approved for 7 m, 10 m may be shot instead.","Ist jemand nicht fertig? - ACHTUNG!":"Is anyone not ready? - STAND BY!","Kann durch ein anderes Signal ersetzt werden, etwa das Wegdrehen der Scheiben. Die Serie beginnt mit dem Herdrehen oder einem anderen Startsignal.":"May be replaced by another signal, for instance turning the targets away. The string begins when they turn back or with another start signal.","Keine Kommandofolge":"No command sequence","Kleinkaliber .22 lr":"Rimfire .22 lr","Kleinkaliber-Fassung der 1020, durchgeführt in Anlehnung an die Regeln der NASRPC Ireland.":"Rimfire version of the 1020, run along the lines of the NASRPC Ireland rules.","Kleinkaliber-Kurzwaffe":"Rimfire handgun","Kleinkaliber-Langwaffe":"Rimfire long gun",kniend:"kneeling","Kniend auf einem Knie, das andere der Scheibe zugewandt. Die Gesäßbacken können auf den Absätzen oder seitlich auf dem Fuß aufliegen, dürfen den Boden aber nicht berühren. Der Arm darf durch das zur Scheibe zeigende Knie stabilisiert werden, die Waffe selbst nicht. Alternativ kniend auf beiden Knien, dann deutlich vom Boden entfernt und ohne weitere Unterstützung.":"Kneeling on one knee, the other facing the target. The buttocks may rest on the heels or sideways on the foot, but must not touch the ground. The arm may be steadied on the knee facing the target, the weapon itself may not. Alternatively kneeling on both knees, then clearly clear of the ground and without any further support.","Kniend frei":"Kneeling unsupported","Kniend mit Pfosten":"Kneeling at the barricade",Kurzwaffe:"Handgun","Laden, fertigmachen und holstern!":"Load, make ready and holster!",Langwaffe:"Long gun","Langwaffenfassung mit Sports Carbine. Weicht von der Kurzwaffen-PP1 auf 15 m und 10 m ab: 3 statt 2 Sekunden je Intervall. Deshalb ein eigener Satz.":"Long gun version with the sports carbine. Differs from the handgun PP1 at 15 m and 10 m: 3 instead of 2 seconds per interval. That is why it has a set of its own.","Langwaffenfassung mit Unterhebelrepetierer. Weicht von der Kurzwaffen-PP1 auf 10 m ab: 3 statt 2 Sekunden je Intervall. Deshalb ein eigener Satz.":"Long gun version with the lever action rifle. Differs from the handgun PP1 at 10 m: 3 instead of 2 seconds per interval. That is why it has a set of its own.","Leere Waffe und gegebenenfalls Magazin der Aufsicht zur Sicherheitsüberprüfung vorzeigen, danach holstern.":"Show the empty weapon, and the magazine where applicable, to the range officer for the safety check, then holster.",liegend:"prone",Liegend:"Prone","Match 1 — 10 m":"Match 1 — 10 m","Match 1 — 15 m":"Match 1 — 15 m","Match 1: 10 m — 20 Sekunden — nur double action — 2 × 6 Schüsse stehend frei. Danach 15 m, 20 Sekunden, 2 × 6 Schüsse stehend frei.":"Match 1: 10 m — 20 seconds — double action only — 2 × 6 rounds standing unsupported. Then 15 m, 20 seconds, 2 × 6 rounds standing unsupported.","Match 1: 15 Meter/Yards - 20 Sekunden - nur double action":"Match 1: 15 metres/yards - 20 seconds - double action only","Match 1: 7 m — 20 Sekunden — nur double action — 12 Schüsse stehend frei. Danach 15 m, 20 Sekunden, 12 Schüsse stehend frei.":"Match 1: 7 m — 20 seconds — double action only — 12 rounds standing unsupported. Then 15 m, 20 seconds, 12 rounds standing unsupported.","Match 1: 7 m — 20 Sekunden — nur double action — 2 × 6 Schüsse stehend frei. Danach 15 m, 20 Sekunden, 2 × 6 Schüsse stehend frei.":"Match 1: 7 m — 20 seconds — double action only — 2 × 6 rounds standing unsupported. Then 15 m, 20 seconds, 2 × 6 rounds standing unsupported.","Match 1: 7 Meter/Yards - 20 Sekunden - nur double action":"Match 1: 7 metres/yards - 20 seconds - double action only","Match 1: Wir gehen auf 15 Meter":"Match 1: We move to 15 metres","Match 1: Wir gehen auf 7 Meter":"Match 1: We move to 7 metres","Match 2 — 25 m":"Match 2 — 25 m","Match 2: 25 m — 90 Sekunden — nur double action — 6 kniend frei, 6 stehend linke Hand Pfosten links, 6 stehend rechte Hand Pfosten rechts.":"Match 2: 25 m — 90 seconds — double action only — 6 kneeling unsupported, 6 standing left hand left barricade, 6 standing right hand right barricade.","Match 2: 25 Meter/Yards - 90 Sekunden - nur double action":"Match 2: 25 metres/yards - 90 seconds - double action only","Match 2: Wir gehen auf 25 Meter":"Match 2: We move to 25 metres","Match 3 — 25 m, 1. Durchgang":"Match 3 — 25 m, 1st run","Match 3 — 25 m, 2. Durchgang":"Match 3 — 25 m, 2nd run","Match 3:":"Match 3:","Match 3: 25 m — 35 Sekunden — nur double action — 2 × 6 Schüsse stehend frei, danach Wiederholung.":"Match 3: 25 m — 35 seconds — double action only — 2 × 6 rounds standing unsupported, then a repeat.","Match 3: 50 m — 165 Sekunden — auch single action — 6 sitzend, 6 liegend, 6 stehend linke Hand Pfosten links, 6 stehend rechte Hand Pfosten rechts.":"Match 3: 50 m — 165 seconds — single action also permitted — 6 seated, 6 prone, 6 standing left hand left barricade, 6 standing right hand right barricade.","Match 3: 50 Meter/Yards - 165 Sekunden - auch single action erlaubt":"Match 3: 50 metres/yards - 165 seconds - single action also permitted","Match 3: Wir bleiben auf 25 Meter":"Match 3: We stay at 25 metres","Match 4 — 25 m":"Match 4 — 25 m","Match 4: 25 m — 165 Sekunden — nur double action — 6 sitzend, 6 kniend frei, 6 stehend linke Hand Pfosten links, 6 stehend rechte Hand Pfosten rechts.":"Match 4: 25 m — 165 seconds — double action only — 6 seated, 6 kneeling unsupported, 6 standing left hand left barricade, 6 standing right hand right barricade.","Match 4: 25 m — 35 Sekunden — nur double action — 12 Schüsse stehend frei, danach Wiederholung.":"Match 4: 25 m — 35 seconds — double action only — 12 rounds standing unsupported, then a repeat.","Match 4: 25 Meter/Yards - 35 Sekunden - nur do
