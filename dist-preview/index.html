eholstert.","Der Stand wird erst freigegeben, wenn alle Schützen entladen und geholstert haben.","Es gibt keine anerkannten Waffen- und Munitionsfehler; Versager und Fehlfunktionen gehen zu Lasten des Schützen (C.6.8)."]},ppc1500:{id:"ppc1500",ruleRef:"C.8.5",label:"BDMP 1500 (PPC) und BDMP 1020",vorher:[{de:"Laden und holstern!",en:"Load and holster!",hinweis:"Die Waffe wird aus dem Holster genommen, geladen und wieder geholstert. Halbautomatische Pistolen werden grundsätzlich unterladen geholstert und erst zu Beginn der Serie fertiggeladen."},{de:"Sind die Schützen fertig?",en:"Is the line ready?",hinweis:"Wer nicht fertig ist, zeigt das klar und deutlich an. Dann lautet das Kommando „Nicht fertig!“ („The line is not ready“)."}],start:[{de:"Achtung!",en:"Stand by!",hinweis:"Kann durch ein anderes Signal ersetzt werden, etwa das Wegdrehen der Scheiben. Die Serie beginnt mit dem Herdrehen oder einem anderen Startsignal."}],abbruch:[{de:"Schießen einstellen!",en:"Cease firing!",hinweis:"Auch ein langanhaltender Pfiff. Das Schießen wird augenblicklich eingestellt."}],nachher:[{de:"Schießen einstellen – Waffe entladen und vorzeigen!",en:"Cease firing – unload and show clear!"},{de:"Sicherheit",en:"The line is clear."}],hinweise:["Die Mündung zeigt beim Vorzeigen immer in Richtung Geschossfang.","Revolver mit ausgeklappter Trommel und den zuletzt enthaltenen Hülsen vorzeigen.","Halbautomatische Pistolen mit offenem Verschluss und dem zuletzt benutzten Magazin vorzeigen.","Der Stand wird erst freigegeben, wenn alle Schützen entladen und geholstert haben.","Ein Verstoß gegen grundlegende Sicherheitsbestimmungen führt zur sofortigen Disqualifikation."]}},ob={stehendFrei:{name:"Stehend frei",ruleRef:"C.8.4",text:"Die Waffe wird mit einer oder beiden Händen gehalten. Unterstützende Hilfsmittel sind untersagt."},stehendPfosten:{name:"Stehend am Pfosten",ruleRef:"C.8.4",text:"Der Pfosten ist als Unterstützung zu benutzen, die Waffe selbst darf ihn nicht berühren. Der Schütze steht rechts hinter dem Pfosten, wenn er links schießt, und umgekehrt. Die gedachte oder markierte Linie an der Schussseite des Balkens darf nicht übertreten werden. Das Schießen am Pfosten beginnt mit der linken Hand; abgezogen wird mit einem Finger derselben Hand. Nur der Abzugsfinger befindet sich im Abzugsbügel, die schießende Hand darf durch die andere unterstützt werden."},kniendFrei:{name:"Kniend frei",ruleRef:"C.8.4",text:"Kniend auf einem Knie, das andere der Scheibe zugewandt. Die Gesäßbacken können auf den Absätzen oder seitlich auf dem Fuß aufliegen, dürfen den Boden aber nicht berühren. Der Arm darf durch das zur Scheibe zeigende Knie stabilisiert werden, die Waffe selbst nicht. Alternativ kniend auf beiden Knien, dann deutlich vom Boden entfernt und ohne weitere Unterstützung."},kniendPfosten:{name:"Kniend mit Pfosten",ruleRef:"C.8.4",text:"Nur für die 40- und 48-Schuss-Matches. Der Pfosten ist zu benutzen, die Waffe darf ihn nicht berühren. Der Schütze kniet links hinter dem Pfosten, wenn er rechts schießt, und umgekehrt."},sitzend:{name:"Sitzend",ruleRef:"C.8.4",text:"Beide Gesäßbacken auf dem Boden, der Körper den Scheiben zugewandt. Eine Hand kann stützen, der Ellenbogen darf den Boden nicht berühren, der Rücken ebenfalls nicht. Ein oder beide Knie dürfen angewinkelt sein. Die Waffe darf nicht durch einen Fuß unterstützt werden. Der Pfosten darf nicht benutzt werden."},liegend:{name:"Liegend",ruleRef:"C.8.4",text:"Der Körper liegt ausgestreckt in Sichtlinie, den Kopf zum Ziel; schräges Liegen ist zulässig, solange die Linie gewahrt bleibt und niemand gestört wird. Die Waffe darf durch eine oder beide am Boden aufliegende Hände unterstützt werden, darf aber selbst keinen Bodenkontakt haben. Der Pfosten darf nicht benutzt werden."}},ub=["Beim Einnehmen aller Stellungen zeigt die Mündung immer in Richtung Geschossfang.","Beim Wechsel von kniend in stehend, sitzend in liegend und liegend in stehend muss die halbautomatische Pistole mit zurückgezogenem Schlitten und entferntem Magazin geführt werden, der Revolver mit geöffneter Trommel und entfernten Hülsen.","Der Abzugsfinger befindet sich dabei deutlich erkennbar außerhalb des Abzugsbügels.","Nachgeladen wird erst nach dem Wechsel der Schießstellung.","Beim Wechsel von sitzend in liegend muss die Waffe nach vorn in Richtung Geschossfang zeigen."],cb={abgesenkt45:{ruleRef:"C.6A.6",text:"Die Waffe wird mit ausgestreckten Armen auf 45 Grad abgesenkt, die Mündung zielt auf den Boden."},npaWaagerecht:{ruleRef:"C.7.6",text:"Die Waffe wird waagerecht zum Boden gehalten. Die Ellenbogen liegen am Körper an, Ober- und Unterarm bilden einen Winkel von 90 Grad. Die Mündung zielt auf die Scheibe."},geholstert:{ruleRef:"C.8.7",text:"Der Schütze steht aufrecht, die geladene Waffe im Holster; halbautomatische Pistolen unterladen. Arme und Hände hängen zwanglos herab und berühren weder Waffe noch Holster, bis sich die Scheiben herdrehen oder ein anderes Startsignal gegeben wird. Eine abweichende Handposition zum Starten eines Timers am Arm oder Pfosten ist zulässig."}},db=[{match:/^Police Pistol 1\b/i,ruleRef:"C.6A",commandSet:"policePistol",readiness:"abgesenkt45",varianten:[{klasse:"kurzwaffe",ruleRef:"C.6A",label:"Police Pistol 1"}],ammo:"30 Patronen",target:"PP-1-Scheibe",ablauf:["25 m: 12 Schüsse in 2 Minuten einschließlich eines eventuellen Nachladens. Jetloader und Speedloader sind erlaubt.","15 m: 2 × 6 Schüsse in Intervallen. Die Scheibe zeigt sich sechsmal für je 2 Sekunden, dabei jeweils 1 Schuss. Danach Nachladen und erneuter Durchgang.","10 m: 6 Schüsse in Intervallen. Die Scheibe zeigt sich dreimal für je 2 Sekunden, dabei jeweils 2 Schüsse."],hinweise:["Probeschüsse sind nicht erlaubt (C.6.6).","Stellung stehend frei, beidhändiges Halten ist erlaubt (C.6.5)."]},{match:/^Police Pistol 2\b/i,ruleRef:"C.6B",commandSet:"policePistol",readiness:"gemischt",varianten:[{klasse:"kurzwaffe",ruleRef:"C.6B",label:"Police Pistol 2"}],ammo:"60 Patronen, dazu 6 Probeschüsse",targ
